name: Windows build and synthetic tests
on:
  push:
    branches: [main]
    tags: [v1.4.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build with Windows .NET Framework compiler
        shell: powershell
        run: .\build.ps1
      - name: Scientific and synthetic boundary tests
        shell: powershell
        run: |
          & .\artifacts\build\FluoLab.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: WPF controls and lifecycle tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $uiOutput = & .\artifacts\build\FluoLab.UiTests.exe 2>&1
          $uiExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $uiOutput | ForEach-Object { Write-Host $_ }
          if ($uiExitCode -ne 0) {
            $uiOutput | ForEach-Object { Write-Host ('::error::' + ($_.ToString() -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')) }
            throw 'UI tests failed.'
          }
  mouse-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Modules/Mouse/package-lock.json
      - name: Restore locked frontend dependencies
        working-directory: Modules/Mouse
        run: npm ci --ignore-scripts
      - name: Strict TypeScript and frontend build
        working-directory: Modules/Mouse
        run: npm run build
  release:
    if: github.ref == 'refs/tags/v1.4.1'
    needs: [framework, mouse-source]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build verified release packages
        shell: powershell
        run: |
          .\build.ps1
          .\scripts\Prepare-FinalsDemo.ps1
          .\scripts\Package-Release.ps1
      - name: Publish tagged public release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.1 dist/FluoLab-Setup-1.4.1.exe dist/FluoLab-Portable-1.4.1.zip dist/FluoLab-Synthetic-Demo-1.4.1.zip dist/FluoLab-1.4.1-SHA256.txt --verify-tag --title "FluoLab 1.4.1" --notes-file docs/Release-1.4.1.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
